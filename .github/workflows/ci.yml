name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Core and Mac app (swift test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    name: iPhone app (Simulator build)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build for the Simulator
        run: |
          xcodebuild build \
            -project iOS/OnePercentiOS.xcodeproj \
            -scheme OnePercentiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  schema:
    name: Sync backend (schema tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run the migration and its tests on a throwaway Postgres
        run: zsh supabase/tests/run-local.sh
