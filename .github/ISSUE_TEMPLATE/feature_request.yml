name: Feature idea
description: Suggest something new or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
      description: The situation or the problem, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you picture it working, on the Mac, the iPhone or both.
    validations:
      required: true
